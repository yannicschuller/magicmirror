<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 946" width="760" height="946" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" role="img" aria-label="Shortcut &quot;Reminders → Mirror&quot;">
<rect width="760" height="946" rx="20" fill="#1c1c1e"/>
<text x="40" y="44" fill="#fff" font-size="20" font-weight="700">Shortcut &quot;Reminders → Mirror&quot;</text>
<rect x="40" y="70" width="680" height="130" rx="14" fill="#2c2c2e"/>
<rect x="54" y="83" width="24" height="24" rx="6" fill="#ff9f0a"/>
<text x="90" y="101" fill="#fff" font-size="16" font-weight="600">Find Reminders</text>
<circle cx="22" cy="95" r="13" fill="#7dd3fc"/><text x="22" y="100" text-anchor="middle" fill="#062234" font-size="14" font-weight="700">1</text>
<text x="90" y="132" fill="#8e8e93">Filter</text><rect x="210" y="118" width="117" height="20" rx="6" fill="#ff9f0a" fill-opacity=".18"/><text x="217" y="132" fill="#ff9f0a" font-weight="600">Is Completed</text><text x="336.8" y="132" fill="#ebebf5">is not</text>
<rect x="210" y="144" width="50" height="20" rx="6" fill="#ff9f0a" fill-opacity=".18"/><text x="217" y="158" fill="#ff9f0a" font-weight="600">List</text><text x="269.6" y="158" fill="#ebebf5">is  [Groceries]</text>
<text x="90" y="184" fill="#8e8e93">Sort by</text><rect x="210" y="170" width="83" height="20" rx="6" fill="#ff9f0a" fill-opacity=".18"/><text x="217" y="184" fill="#ff9f0a" font-weight="600">Due Date</text>
<rect x="40" y="216" width="680" height="52" rx="14" fill="#2c2c2e"/><rect x="54" y="229" width="24" height="24" rx="6" fill="#8e8e93"/><circle cx="22" cy="241" r="13" fill="#7dd3fc"/><text x="22" y="246" text-anchor="middle" fill="#062234" font-size="14" font-weight="700">2</text>
<text x="90" y="247" fill="#fff" font-size="16" font-weight="600">Repeat with each item in</text><rect x="323.20000000000005" y="233" width="92" height="20" rx="6" fill="#0a84ff" fill-opacity=".18"/><text x="330.20000000000005" y="247" fill="#0a84ff" font-weight="600">Reminders</text>
<rect x="68" y="278" width="652" height="104" rx="14" fill="#2c2c2e"/>
<rect x="82" y="291" width="24" height="24" rx="6" fill="#ffd60a"/>
<text x="118" y="309" fill="#fff" font-size="16" font-weight="600">Text</text>
<rect x="118" y="326" width="176" height="20" rx="6" fill="#0a84ff" fill-opacity=".18"/><text x="125" y="340" fill="#0a84ff" font-weight="600">Repeat Item › Title</text><text x="301.6" y="340" fill="#ebebf5">|</text><rect x="315.6" y="326" width="201" height="20" rx="6" fill="#0a84ff" fill-opacity=".18"/><text x="322.6" y="340" fill="#0a84ff" font-weight="600">Repeat Item › Due Date</text>
<text x="118" y="366" fill="#8e8e93" font-size="12">↳ Date Format: ISO 8601</text>
<rect x="40" y="392" width="680" height="40" rx="14" fill="#2c2c2e"/><text x="90" y="418" fill="#8e8e93" font-size="15">End Repeat</text>
<rect x="44" y="266" width="3" height="126" fill="#8e8e93" fill-opacity=".5"/>
<rect x="40" y="448" width="680" height="78" rx="14" fill="#2c2c2e"/>
<rect x="54" y="461" width="24" height="24" rx="6" fill="#ffd60a"/>
<text x="90" y="479" fill="#fff" font-size="16" font-weight="600">Combine Text</text>
<circle cx="22" cy="473" r="13" fill="#7dd3fc"/><text x="22" y="478" text-anchor="middle" fill="#062234" font-size="14" font-weight="700">3</text>
<rect x="90" y="496" width="134" height="20" rx="6" fill="#0a84ff" fill-opacity=".18"/><text x="97" y="510" fill="#0a84ff" font-weight="600">Repeat Results</text><text x="235.60000000000002" y="510" fill="#ebebf5">with</text><rect x="279.6" y="496" width="92" height="20" rx="6" fill="#8e8e93" fill-opacity=".18"/><text x="286.6" y="510" fill="#8e8e93" font-weight="600">New Lines</text>
<rect x="40" y="542" width="680" height="156" rx="14" fill="#2c2c2e"/>
<rect x="54" y="555" width="24" height="24" rx="6" fill="#0a84ff"/>
<text x="90" y="573" fill="#fff" font-size="16" font-weight="600">Get Contents of URL</text>
<circle cx="22" cy="567" r="13" fill="#7dd3fc"/><text x="22" y="572" text-anchor="middle" fill="#062234" font-size="14" font-weight="700">4</text>
<text x="90" y="604" fill="#8e8e93">URL</text><text x="200" y="604" fill="#fff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5">http://&lt;mirror-ip&gt;:8080/api/push/tasks</text>
<text x="90" y="630" fill="#8e8e93">Method</text><text x="200" y="630" fill="#fff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5">POST</text>
<text x="90" y="656" fill="#8e8e93">Headers</text><text x="200" y="656" fill="#fff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5">Authorization  =  Bearer &lt;TOKEN&gt;</text>
<text x="90" y="682" fill="#8e8e93">Body</text><text x="200" y="682" fill="#fff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5">File  →  [Combined Text]</text>
<text x="40" y="738" fill="#fff" font-size="17" font-weight="700">Automation (&quot;Automation&quot; tab → +)</text>
<rect x="40" y="752" width="680" height="130" rx="14" fill="#2c2c2e"/>
<rect x="54" y="765" width="24" height="24" rx="6" fill="#30d158"/>
<text x="90" y="783" fill="#fff" font-size="16" font-weight="600">Automation</text>
<text x="90" y="814" fill="#8e8e93">When</text><text x="160" y="814" fill="#ebebf5">&quot;Reminders&quot; is closed</text>
<text x="90" y="840" fill="#8e8e93"></text><text x="160" y="840" fill="#ebebf5">Run Immediately  ·  notification off</text>
<text x="90" y="866" fill="#8e8e93">Do</text><text x="160" y="866" fill="#ebebf5">Run Shortcut: Reminders → Mirror</text>
<text x="40" y="916" fill="#8e8e93" font-size="13">Token and address are shown in the admin panel in the &quot;Tasks &amp; shopping list&quot; module.</text>
</svg>
