# Local development incl. a mock OIDC server (navikt/mock-oauth2-server):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Mirror: http://localhost:8080   Admin: http://localhost:8080/admin
# "Sign in with SSO" → mock login page: enter any username.
# Local account: use the setup code from `docker compose logs magicmirror`.
services:
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: "9000"
      JSON_CONFIG: '{"interactiveLogin": true}'
    ports:
      - "8080:8080"   # mirror port (shared network namespace)
      - "9000:9000"   # OIDC issuer

  magicmirror:
    # Shares the network namespace with mock-oidc so that "localhost:9000"
    # is the same issuer for the browser and the container.
    network_mode: service:mock-oidc
    ports: !reset []
    environment:
      OIDC_ISSUER_URL: http://localhost:9000/default
      OIDC_CLIENT_ID: magicmirror
      OIDC_CLIENT_SECRET: dev-secret
      BASE_URL: http://localhost:8080
      SESSION_SECRET: dev-session-secret-change-me-0123456789
    volumes:
      - ./data:/data
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./.git:/app/.git:ro   # shows the current commit in the admin panel
