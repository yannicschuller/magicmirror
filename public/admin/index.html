<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magic Mirror – Admin</title>
  <link rel="stylesheet" href="/vendor/inter/400.css">
  <link rel="stylesheet" href="/vendor/inter/500.css">
  <link rel="stylesheet" href="/vendor/inter/600.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo"></span><span>Magic Mirror</span></div>
    <nav class="tabs" id="tabs">
      <button data-view="layout" class="active">Seiten &amp; Layout</button>
      <button data-view="modules">Module</button>
      <button data-view="general">Allgemein</button>
      <button data-view="backup">Import / Export</button>
    </nav>
    <div class="actions">
      <span id="dirty" class="dirty" hidden>Ungespeicherte Änderungen</span>
      <button id="discard" class="btn ghost" hidden>Verwerfen</button>
      <button id="save" class="btn primary" disabled>Speichern</button>
      <a class="btn ghost" href="/" target="_blank" rel="noopener">Spiegel öffnen ↗</a>
      <div class="user"><span id="user"></span><a href="/auth/logout" title="Abmelden">Abmelden</a></div>
    </div>
  </header>
  <main id="view"></main>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="admin.js"></script>
</body>
</html>
