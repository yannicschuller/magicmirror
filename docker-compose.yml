# Magic Mirror – https://github.com/yannicschuller/magicmirror
#
#   cp .env.example .env      # or run the installer (install.sh)
#   docker compose up -d
#
# Optional services are enabled via COMPOSE_PROFILES in .env:
#   kiosk       full-screen browser on the HDMI output of this machine
#   autoupdate  daily update of images (and the git checkout)
#   camera      go2rtc for RTSP cameras
#   adsb        own ADS-B receiver (RTL-SDR USB stick)
#   fr24        feed Flightradar24 (implies the ADS-B receiver)
#   waste       find the waste collection calendar by town/address (no iCal needed)
#
# Images are published for amd64, arm64 and arm/v7 (Raspberry Pi 3/4/5).
# To build locally instead: docker compose up -d --build

services:
  magicmirror:
    image: ${MM_REGISTRY:-ghcr.io/yannicschuller}/magicmirror:${MM_TAG:-latest}
    build: .
    restart: unless-stopped
    ports:
      - "${MIRROR_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      GO2RTC_URL: http://go2rtc:1984
      UPDATER_URL: http://updater:8099
      WASTECOLLECT_URL: http://wastecollect:8098
    volumes:
      - ./data:/data

  # Full-screen kiosk on the HDMI output (profile "kiosk").
  # Needs a Raspberry Pi OS *Lite* host (no desktop running on the display).
  kiosk:
    # KIOSK_BROWSER=cog (WPE WebKit, light – default) or chromium
    image: ${MM_REGISTRY:-ghcr.io/yannicschuller}/magicmirror-kiosk-${KIOSK_BROWSER:-cog}:${MM_TAG:-latest}
    build:
      context: ./kiosk
      args:
        BROWSER: ${KIOSK_BROWSER:-cog}
    profiles: ["kiosk"]
    restart: unless-stopped
    depends_on:
      - magicmirror
    # Direct access to the GPU (DRM/KMS), input devices and the virtual terminal.
    privileged: true
    shm_size: 256m
    environment:
      MIRROR_URL: ${KIOSK_URL:-http://magicmirror:8080/}
      KIOSK_FLAGS: ${KIOSK_FLAGS:-}
    volumes:
      - /run/udev:/run/udev:ro
    tmpfs:
      - /tmp

  # Daily auto-update (profile "autoupdate").
  updater:
    image: ${MM_REGISTRY:-ghcr.io/yannicschuller}/magicmirror-updater:${MM_TAG:-latest}
    build: ./updater
    profiles: ["autoupdate"]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      UPDATE_TIME: ${UPDATE_TIME:-04:00}
      UPDATE_MODE: ${UPDATE_MODE:-pull}
      UPDATE_GIT: ${UPDATE_GIT:-true}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project

  # Waste collection dates by town/address (profile "waste"), based on the
  # "Waste Collection Schedule" library. Only reachable from the mirror server.
  wastecollect:
    image: ${MM_REGISTRY:-ghcr.io/yannicschuller}/magicmirror-wastecollect:${MM_TAG:-latest}
    build: ./wastecollect
    profiles: ["waste"]
    restart: unless-stopped

  # RTSP cameras → browser (profile "camera")
  go2rtc:
    image: alexxit/go2rtc:1.9.9
    profiles: ["camera"]
    restart: unless-stopped
    # Inline configuration: the mirror server registers streams at runtime
    # (admin panel → camera module), so credentials never land in files.
    # RTSP is only used internally (ffmpeg/snapshots). No ports are published.
    command: ["go2rtc", "-config", "{api: {listen: ':1984'}, rtsp: {listen: ':8554'}, webrtc: {listen: ''}}"]

  # Own ADS-B receiver with an RTL-SDR USB stick (profile "adsb")
  # Serves http://ultrafeeder/data/aircraft.json for the aircraft module
  # and the tar1090 web UI on port ${TAR1090_PORT:-8090}.
  ultrafeeder:
    image: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder:latest
    hostname: ultrafeeder
    profiles: ["adsb", "fr24"]
    restart: unless-stopped
    device_cgroup_rules:
      - "c 189:* rwm"
    ports:
      - "${TAR1090_PORT:-8090}:80"
    environment:
      - LOGLEVEL=error
      - TZ=${TZ:-Europe/Berlin}
      - READSB_DEVICE_TYPE=rtlsdr
      - READSB_RTLSDR_DEVICE=${ADSB_SDR_SERIAL:-}
      - READSB_RTLSDR_PPM=${ADSB_PPM:-0}
      - READSB_GAIN=${ADSB_GAIN:-autogain}
      - READSB_LAT=${ADSB_LAT:-}
      - READSB_LON=${ADSB_LON:-}
      - READSB_ALT=${ADSB_ALT:-50m}
      - READSB_RX_LOCATION_ACCURACY=2
      - READSB_STATS_RANGE=true
      - UPDATE_TAR1090=true
      - TAR1090_DEFAULTCENTERLAT=${ADSB_LAT:-}
      - TAR1090_DEFAULTCENTERLON=${ADSB_LON:-}
      - TAR1090_SITESHOW=true
      # Optionally feed other networks, e.g.:
      # ULTRAFEEDER_CONFIG=adsb,feed.adsb.lol,30004,beast_reduce_plus_out;mlat,feed.adsb.lol,31090,39001
      - ULTRAFEEDER_CONFIG=${ULTRAFEEDER_CONFIG:-}
      - MLAT_USER=${ADSB_MLAT_USER:-}
      # Spare the SD card: keep state and graph data in RAM and write it to disk
      # only on shutdown / once a day (a power cut loses at most that data).
      - READSB_WRITE_STATE_ONLY_ON_EXIT=${ADSB_SAVE_STATE_ON_EXIT_ONLY:-true}
      - GRAPHS1090_REDUCE_IO=${ADSB_REDUCE_IO:-true}
      - GRAPHS1090_REDUCE_IO_FLUSH_IVAL=${ADSB_FLUSH_INTERVAL:-1d}
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ./adsb/globe_history:/var/globe_history
      - ./adsb/collectd:/var/lib/collectd
    tmpfs:
      - /run:exec,size=256M
      - /var/log:size=32M
    # Time to write the state to disk when stopping.
    stop_grace_period: 1m

  # Share data with Flightradar24 (profile "fr24", needs FR24_SHARING_KEY)
  fr24:
    image: ghcr.io/sdr-enthusiasts/docker-flightradar24:latest
    profiles: ["fr24"]
    restart: unless-stopped
    depends_on:
      - ultrafeeder
    ports:
      - "8754:8754"
    environment:
      - BEASTHOST=ultrafeeder
      - FR24KEY=${FR24_SHARING_KEY:-}
      - MLAT=no
    tmpfs:
      - /var/log
